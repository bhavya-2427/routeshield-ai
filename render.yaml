services:
  - type: web
    name: routeshield-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_AUTO_VERIFY   # no SMTP yet -> skip OTP so the demo is usable. Remove once SMTP_* are set.
        value: "1"
      # Optional real OTP emails (Gmail app password etc.):
      # SMTP_HOST=smtp.gmail.com  SMTP_PORT=587  SMTP_USER=...  SMTP_PASSWORD=...
